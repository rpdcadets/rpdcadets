<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training — Richardson Police Public Safety Cadets Unit #761</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#1a2744;--navy-deep:#0f1a30;--navy-light:#253758;--red:#c0392b;--red-glow:#e74c3c;--gold:#d4a952;--white:#fff;--text-muted:#8899b0;--green:#27ae60;--blue:#3498db;--purple:#8e44ad;--card-bg:rgba(255,255,255,0.025);--card-border:rgba(255,255,255,0.06);--input-bg:rgba(255,255,255,0.04);--input-border:rgba(255,255,255,0.1)}
html{scroll-behavior:smooth}
body{font-family:'Barlow',sans-serif;background:var(--navy-deep);color:var(--white);-webkit-font-smoothing:antialiased;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:0 24px}
nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(15,26,48,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);transition:all .4s}
nav.scrolled{background:rgba(15,26,48,0.97);box-shadow:0 4px 30px rgba(0,0,0,0.3)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:72px}
.nav-brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--white)}
.nav-brand img{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,0.15)}
.nav-brand-text{display:flex;flex-direction:column;line-height:1.15}
.nav-brand-dept{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
.nav-brand-unit{font-family:'Barlow Condensed',sans-serif;font-weight:400;font-size:13px;letter-spacing:1px;color:var(--text-muted)}
.nav-links{display:flex;align-items:center;gap:8px;list-style:none}
.nav-links a{text-decoration:none;color:rgba(255,255,255,0.7);font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 16px;border-radius:6px;transition:all .3s;position:relative}
.nav-links a:hover,.nav-links a.active{color:var(--white);background:rgba(255,255,255,0.08)}
.nav-links a.active::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:16px;height:2px;background:var(--red);border-radius:2px}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;background:none;border:none}
.hamburger span{width:24px;height:2px;background:var(--white);border-radius:2px}
.mobile-menu{display:none;position:fixed;top:72px;left:0;right:0;background:rgba(15,26,48,0.98);backdrop-filter:blur(20px);padding:24px;border-bottom:1px solid rgba(255,255,255,0.06);z-index:999}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:14px 0;color:rgba(255,255,255,0.7);text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:16px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.04)}
.mobile-menu a:last-child{border-bottom:none}
footer{background:var(--navy);border-top:1px solid rgba(255,255,255,0.05);padding:40px 0}
.footer-bottom{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.footer-copy{font-size:12px;color:rgba(255,255,255,0.3)}
.footer-back a{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);text-decoration:none}

/* LOCK */
.lock-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:72px 24px 40px;position:relative}
.lock-bg{position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(26,39,68,0.95) 0%,rgba(15,26,48,1) 70%);z-index:0}
.lock-bg::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:60px 60px}
.lock-card{position:relative;z-index:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:60px 48px;max-width:440px;width:100%;text-align:center;backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,0.3);animation:cardIn .6s ease forwards}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.lock-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--gold),var(--red));border-radius:20px 20px 0 0}
.lock-icon{width:72px;height:72px;margin:0 auto 28px;background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center}
.lock-icon svg{color:var(--red)}
.lock-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;margin-bottom:8px}
.lock-subtitle{font-weight:300;font-size:14px;color:var(--text-muted);margin-bottom:36px;line-height:1.6}
.lock-input{width:100%;padding:16px 20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--white);font-family:'Barlow',sans-serif;font-size:16px;letter-spacing:4px;text-align:center;outline:none;transition:all .3s}
.lock-input::placeholder{letter-spacing:1px;color:rgba(255,255,255,0.25);font-size:14px}
.lock-input:focus{border-color:rgba(192,57,43,0.5);background:rgba(255,255,255,0.06);box-shadow:0 0 20px rgba(192,57,43,0.1)}
.lock-btn{width:100%;padding:16px;background:var(--red);color:var(--white);border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;transition:all .35s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 20px rgba(192,57,43,0.3);margin-top:20px}
.lock-btn:hover{background:var(--red-glow);transform:translateY(-2px)}
.lock-error{margin-top:16px;font-size:13px;color:var(--red-glow);opacity:0;transition:opacity .3s;height:20px}
.lock-error.show{opacity:1}
.lock-home{margin-top:32px}
.lock-home a{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.training-content{display:none;padding:120px 0 80px}
.training-content.unlocked{display:block;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Page header */
.page-header{text-align:center;margin-bottom:32px}
.section-label{font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:12px}
.section-label::before{content:'';width:24px;height:1px;background:var(--red)}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,5vw,48px);letter-spacing:2px;line-height:1;margin-bottom:12px}
.page-desc{font-weight:300;font-size:15px;color:rgba(255,255,255,0.5);max-width:520px;margin:0 auto;line-height:1.7}

/* TABS */
.tab-bar{display:flex;gap:4px;background:rgba(255,255,255,0.03);border:1px solid var(--card-border);border-radius:12px;padding:4px;margin-bottom:32px}
.tab-btn{flex:1;padding:14px 16px;border:none;background:transparent;color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;border-radius:8px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.tab-btn:hover{color:var(--white);background:rgba(255,255,255,0.04)}
.tab-btn.active{background:var(--red);color:var(--white);box-shadow:0 4px 16px rgba(192,57,43,0.3)}
.tab-btn svg{width:16px;height:16px;flex-shrink:0}
.tab-panel{display:none;animation:fadeTab .4s ease}
.tab-panel.active{display:block}
@keyframes fadeTab{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ═══ SCHEDULE STYLES ═══ */
.info-banner{background:rgba(255,255,255,0.03);border:1px solid var(--card-border);border-radius:12px;padding:18px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.info-banner-icon{width:40px;height:40px;border-radius:10px;background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.2);display:flex;align-items:center;justify-content:center;color:var(--red);flex-shrink:0}
.info-banner-text{flex:1}
.info-banner-main{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:1px;margin-bottom:2px}
.info-banner-sub{font-size:12px;color:var(--text-muted);font-weight:300}
.month-nav-bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:24px;position:sticky;top:72px;z-index:50;background:var(--navy-deep);padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.month-jump{padding:6px 14px;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid var(--card-border);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);cursor:pointer;transition:all .3s;text-decoration:none}
.month-jump:hover,.month-jump.active{background:var(--red);color:var(--white);border-color:var(--red)}
.legend{display:flex;gap:16px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}
.legend-dot{width:8px;height:8px;border-radius:3px}
.legend-dot.training{background:var(--blue)}.legend-dot.competition{background:var(--gold)}.legend-dot.special{background:var(--purple)}.legend-dot.off{background:var(--red)}
.month-section{margin-bottom:36px}
.month-header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.month-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px}
.month-line{flex:1;height:1px;background:rgba(255,255,255,0.08)}
.month-year{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;color:var(--text-muted)}
.ev{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;margin-bottom:5px;transition:all .25s;position:relative;overflow:hidden}
.ev:hover{background:rgba(255,255,255,0.04)}
.ev::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.ev.t::before{background:var(--blue)}.ev.c::before{background:var(--gold)}.ev.s::before{background:var(--purple)}.ev.o::before{background:var(--red);opacity:.5}
.ev.o{opacity:.5}
.ev-d{min-width:44px;text-align:center;flex-shrink:0}
.ev-day{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1}
.ev-dow{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted)}
.ev-div{width:1px;height:28px;background:rgba(255,255,255,0.06);flex-shrink:0}
.ev-i{flex:1}
.ev-topic{font-weight:500;font-size:14px;margin-bottom:1px}
.ev-time{font-size:11px;color:var(--text-muted)}
.ev-tag{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:20px;flex-shrink:0}
.tag-t{background:rgba(52,152,219,0.12);color:var(--blue)}.tag-c{background:rgba(212,169,82,0.12);color:var(--gold)}.tag-s{background:rgba(142,68,173,0.12);color:var(--purple)}.tag-o{background:rgba(220,38,38,0.1);color:var(--red-glow)}
.ev-feat{padding:20px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;margin-bottom:6px;position:relative;overflow:hidden;transition:all .3s}
.ev-feat:hover{background:rgba(255,255,255,0.04);transform:translateY(-2px)}
.ev-feat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.ev-feat.c::before{background:linear-gradient(90deg,var(--gold),var(--red),var(--gold))}.ev-feat.s::before{background:linear-gradient(90deg,var(--purple),var(--gold),var(--purple))}
.feat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.feat-date{display:flex;flex-direction:column;align-items:center;min-width:48px}
.feat-mo{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--red)}
.feat-day{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1}
.feat-dow{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:var(--text-muted)}
.feat-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;line-height:1.1;margin-bottom:4px}
.feat-desc{font-size:12px;color:var(--text-muted);font-weight:300}
.ev.is-past,.ev-feat.is-past{opacity:.35}
.ev.is-today{border-color:rgba(192,57,43,0.3);background:rgba(192,57,43,0.04)}
.ev.is-today .ev-day{color:var(--red)}

/* ═══ RESOURCE HUB STYLES ═══ */
.sub-tabs{display:flex;gap:4px;background:rgba(255,255,255,0.03);border:1px solid var(--card-border);border-radius:12px;padding:4px;margin-bottom:28px}
.sub-tab{flex:1;padding:14px 10px;border:none;background:transparent;color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;border-radius:8px;cursor:pointer;transition:all .3s;text-align:center;white-space:nowrap}
.sub-tab:hover{color:var(--white);background:rgba(255,255,255,0.04)}
.sub-tab.active{background:var(--red);color:var(--white);box-shadow:0 4px 16px rgba(192,57,43,0.3)}
.sub-panel{display:none;animation:fadeTab .4s ease}
.sub-panel.active{display:block}
.search-bar{margin-bottom:20px;position:relative}
.search-bar input{width:100%;padding:12px 16px 12px 44px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;color:var(--white);font-size:14px;outline:none;transition:all .3s;font-family:'Barlow',sans-serif}
.search-bar input:focus{border-color:rgba(192,57,43,0.4);box-shadow:0 0 16px rgba(192,57,43,0.08)}
.search-bar input::placeholder{color:rgba(255,255,255,0.2)}
.search-bar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);opacity:.5}
.search-count{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);text-align:right;margin-top:6px}
.code-grid{display:flex;flex-direction:column;gap:3px}
.cr{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;transition:all .2s}
.cr:hover{background:rgba(255,255,255,0.04)}
.cr.hidden{display:none}
.cr-n{font-family:'Bebas Neue',sans-serif;font-size:20px;min-width:48px;color:var(--red);text-align:center;flex-shrink:0}
.cr-div{width:1px;height:22px;background:rgba(255,255,255,0.06);flex-shrink:0}
.cr-d{font-size:13px;color:rgba(255,255,255,0.7);flex:1}
.cr-note{font-size:10px;color:var(--text-muted);font-style:italic;margin-top:1px}
.code-cat{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);padding:14px 0 6px;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:3px}
.alpha-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:5px}
.alpha-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px}
.alpha-item:hover{background:rgba(255,255,255,0.04)}
.alpha-letter{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--red);width:24px;text-align:center}
.alpha-word{font-size:13px;color:rgba(255,255,255,0.7)}
.miranda-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;overflow:hidden;max-width:600px;margin:0 auto}
.miranda-header{background:rgba(192,57,43,0.08);padding:18px 24px;border-bottom:1px solid rgba(192,57,43,0.15);display:flex;align-items:center;justify-content:space-between}
.miranda-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px}
.miranda-toggle{display:flex;gap:2px;background:rgba(0,0,0,0.2);border-radius:6px;padding:2px}
.miranda-toggle button{padding:6px 16px;border:none;background:transparent;color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;border-radius:4px;cursor:pointer;transition:all .3s}
.miranda-toggle button.active{background:var(--red);color:var(--white)}
.miranda-body{padding:24px}
.miranda-text{display:none}
.miranda-text.active{display:block}
.miranda-item{padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:14px;line-height:1.7;color:rgba(255,255,255,0.75);display:flex;gap:10px}
.miranda-item:last-of-type{border-bottom:none}
.miranda-num{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--red);min-width:24px;flex-shrink:0}
.miranda-footer{padding:16px 24px;background:rgba(0,0,0,0.1);border-top:1px solid rgba(255,255,255,0.04);font-size:12px;color:var(--text-muted);line-height:1.7;font-style:italic}
.cad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:5px}
.cad-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px}
.cad-row:hover{background:rgba(255,255,255,0.04)}
.cad-row.hidden{display:none}
.cad-code{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;color:var(--gold);min-width:32px}
.cad-desc{font-size:12px;color:rgba(255,255,255,0.65)}

@media(max-width:900px){.nav-links{display:none}.hamburger{display:flex}}
@media(max-width:600px){
.tab-btn{font-size:11px;padding:12px 8px;letter-spacing:1px}.tab-btn svg{display:none}
.sub-tab{font-size:10px;padding:12px 6px;letter-spacing:.8px}
.info-banner{flex-direction:column;text-align:center}
.ev-tag{display:none}.ev-d{min-width:38px}.ev-day{font-size:20px}
.month-nav-bar{gap:4px}.month-jump{padding:5px 10px;font-size:11px}
.alpha-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.cad-grid{grid-template-columns:1fr}
.footer-bottom{flex-direction:column;text-align:center}
}
@media(max-width:500px){.lock-card{padding:48px 28px}}
</style>
</head>
<body>
<div id="site-nav"></div>

<!-- LOCK -->
<div class="lock-screen" id="lockScreen">
<div class="lock-bg"></div>
<div class="lock-card">
<div class="lock-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
<h2 class="lock-title">Cadets Only</h2>
<p class="lock-subtitle">Training resources are restricted to unit members.<br>Enter your unit passcode to continue.</p>
<input type="password" class="lock-input" id="passcodeInput" placeholder="Enter passcode" autocomplete="off" autofocus>
<button class="lock-btn" id="unlockBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>Unlock</button>
<div class="lock-error" id="lockError">Incorrect passcode. Please try again.</div>
<div class="lock-home"><a href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Return to Home</a></div>
</div>
</div>

<!-- TRAINING CONTENT -->
<div class="training-content" id="trainingContent">
</div><!-- end training-content -->


<script>

  const ITERATIONS = 150000;
  const CONTENT_ID = "trainingContent";

  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  function b64ToArr(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function decryptContent(password) {
    try {
      const [headerB64, cipherB64] = ENCRYPTED.split('.');
      const header = b64ToArr(headerB64);
      const salt = header.slice(0, 16);
      const iv = header.slice(16, 28);
      const tag = header.slice(28, 44);
      const ciphertext = b64ToArr(cipherB64);
      // Combine ciphertext + tag for Web Crypto (it expects them concatenated)
      const combined = new Uint8Array(ciphertext.length + tag.length);
      combined.set(ciphertext);
      combined.set(tag, ciphertext.length);
      const key = await deriveKey(password, salt);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, combined);
      return new TextDecoder().decode(decrypted);
    } catch(e) {
      return null;
    }
  }

      // Month nav
      var sects=document.querySelectorAll('.month-section');var navs=document.querySelectorAll('.month-jump');
      var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){navs.forEach(function(l){l.classList.remove('active')});var a=document.querySelector('.month-jump[href="#'+e.target.id+'"]');if(a)a.classList.add('active')}})},{threshold:0.3,rootMargin:'-100px 0px -60% 0px'});
      sects.forEach(function(s){obs.observe(s)});
      document.querySelectorAll('.month-jump').forEach(function(l){l.addEventListener('click',function(e){e.preventDefault();var t=document.querySelector(l.getAttribute('href'));var y=t.getBoundingClientRect().top+window.pageYOffset-90;window.scrollTo({top:y,behavior:'smooth'})})});
  
    } else {
      error.classList.add('show');
      input.value = '';
      input.focus();
      const c = document.querySelector('.lock-card');
      c.style.animation = 'none';
      c.offsetHeight;
      c.style.animation = 'shake .5s ease';
    }
  }

  // Auto-unlock from session
  async function trySession() {
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (!saved) return;
    const html = await decryptContent(saved);
    if (html) {
      document.getElementById('lockScreen').style.display = 'none';
      const container = document.getElementById(CONTENT_ID);
      container.innerHTML = html;
      container.classList.add('unlocked');
      
      // Re-init tabs
      window.switchTab = function(t){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));var m={schedule:0,resources:1};document.querySelectorAll('.tab-btn')[m[t]].classList.add('active');var p={schedule:'panelSchedule',resources:'panelResources'};document.getElementById(p[t]).classList.add('active');};
      window.showSub = function(id){document.querySelectorAll('.sub-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.sub-panel').forEach(p=>p.classList.remove('active'));var m={signals:0,tencodes:1,miranda:2,cad:3,alpha:4};var p={signals:'subSignals',tencodes:'subTencodes',miranda:'subMiranda',cad:'subCad',alpha:'subAlpha'};document.querySelectorAll('.sub-tab')[m[id]].classList.add('active');document.getElementById(p[id]).classList.add('active');};
      window.filterC = function(q,cls,cid){var s=q.toLowerCase().trim();var rows=document.querySelectorAll('.'+cls);var n=0;rows.forEach(function(r){var m=!s||r.dataset.s.includes(s);r.classList.toggle('hidden',!m);if(m)n++});var el=document.getElementById(cid);el.textContent=s?n+' of '+rows.length+' results':'';};
      window.toggleM = function(lang,btn){document.querySelectorAll('.miranda-toggle button').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');document.getElementById('mirandaEn').classList.toggle('active',lang==='en');document.getElementById('mirandaEs').classList.toggle('active',lang==='es');document.getElementById('mirandaTitle').textContent=lang==='en'?'Adult Warning':'Aviso De Adulto';document.getElementById('mirandaFooter').style.display=lang==='en'?'block':'none';};
      // Schedule date highlighting
      var today=new Date();today.setHours(0,0,0,0);
      document.querySelectorAll('[data-date]').forEach(function(el){var d=new Date(el.dataset.date+'T12:00:00');var diff=d-today;if(diff<0)el.classList.add('is-past');else if(diff<864e5){el.classList.add('is-today');var t=el.querySelector('.ev-topic')||el.querySelector('.feat-title');if(t){var dot=document.createElement('span');dot.style.cssText='width:6px;height:6px;border-radius:50%;background:#c0392b;animation:pulse 2s ease infinite;margin-left:8px;display:inline-block';t.appendChild(dot)}}});
      // Month nav
      var sects=document.querySelectorAll('.month-section');var navs=document.querySelectorAll('.month-jump');
      var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){navs.forEach(function(l){l.classList.remove('active')});var a=document.querySelector('.month-jump[href="#'+e.target.id+'"]');if(a)a.classList.add('active')}})},{threshold:0.3,rootMargin:'-100px 0px -60% 0px'});
      sects.forEach(function(s){obs.observe(s)});
      document.querySelectorAll('.month-jump').forEach(function(l){l.addEventListener('click',function(e){e.preventDefault();var t=document.querySelector(l.getAttribute('href'));var y=t.getBoundingClientRect().top+window.pageYOffset-90;window.scrollTo({top:y,behavior:'smooth'})})});
  
    }
  }

  document.getElementById('unlockBtn').addEventListener('click', unlockPage);
  document.getElementById('passcodeInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') unlockPage();
    document.getElementById('lockError').classList.remove('show');
  });

  const shakeStyle = document.createElement('style');
  shakeStyle.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}';
  document.head.appendChild(shakeStyle);

  trySession();
})();
</script>
<script>
var ps=document.createElement('style');ps.textContent='@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}';document.head.appendChild(ps);
</script>
<script src="shared.js"></script>
</body>
</html>
