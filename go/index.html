<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=generalorders.pdf">
  <meta name="robots" content="noindex">
  <title>Redirecting to the General Orders</title>
  <script>
    // Append a fresh timestamp on every visit so the browser and CDN
    // always fetch the current PDF, never a cached older version.
    window.location.replace("generalorders.pdf?t=" + Date.now());
  </script>
</head>
<body style="font-family:Helvetica,Arial,sans-serif;color:#1B2A4A;text-align:center;padding:3rem">
  <p>Opening the Public Safety Cadets General Orders.</p>
  <p>If nothing happens, <a href="generalorders.pdf" style="color:#C41E3A">tap here to open the PDF</a>.</p>
</body>
</html>
