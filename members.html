<!DOCTYPE html>
<!-- members.html | Build v3 | 07/09/26 | Full Packet card now styled as required: gold left border and gold asterisk, matching the other required documents. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members — Richardson Police Public Safety Cadets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="roster.js?v=5"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#1a2744;--navy-deep:#0f1a30;--navy-light:#253758;--red:#c0392b;--red-glow:#e74c3c;--gold:#d4a952;--gold-light:#f0d68a;--white:#fff;--text-muted:#8899b0;--green:#27ae60;--blue:#3498db;--yellow:#f1c40f;--suspend-red:#dc2626;--card-bg:rgba(255,255,255,0.025);--card-border:rgba(255,255,255,0.06);--input-bg:rgba(255,255,255,0.04);--input-border:rgba(255,255,255,0.1)}
html{scroll-behavior:smooth}
body{font-family:'Barlow',sans-serif;background:var(--navy-deep);color:var(--white);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.container{max-width:960px;margin:0 auto;padding:0 24px}

/* NAV styles needed for shared.js injection */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(15,26,48,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);transition:all .4s}
nav.scrolled{background:rgba(15,26,48,0.97);box-shadow:0 4px 30px rgba(0,0,0,0.3)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:72px}
.nav-brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--white)}
.nav-brand img{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,0.15)}
.nav-brand-text{display:flex;flex-direction:column;line-height:1.15}
.nav-brand-dept{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
.nav-brand-unit{font-family:'Barlow Condensed',sans-serif;font-weight:400;font-size:13px;letter-spacing:1px;color:var(--text-muted)}
.nav-links{display:flex;align-items:center;gap:8px;list-style:none}
.nav-links a{text-decoration:none;color:rgba(255,255,255,0.7);font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 16px;border-radius:6px;transition:all .3s;position:relative}
.nav-links a:hover,.nav-links a.active{color:var(--white);background:rgba(255,255,255,0.08)}
.nav-links a.active::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:16px;height:2px;background:var(--red);border-radius:2px}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;background:none;border:none}
.hamburger span{width:24px;height:2px;background:var(--white);border-radius:2px}
.mobile-menu{display:none;position:fixed;top:72px;left:0;right:0;background:rgba(15,26,48,0.98);backdrop-filter:blur(20px);padding:24px;border-bottom:1px solid rgba(255,255,255,0.06);z-index:999}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:14px 0;color:rgba(255,255,255,0.7);text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:16px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.04)}
.mobile-menu a:last-child{border-bottom:none}
.mobile-menu a:hover{color:var(--white)}
footer{background:var(--navy);border-top:1px solid rgba(255,255,255,0.05);padding:40px 0}
.footer-inner{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:40px;max-width:1200px;margin:0 auto;padding:0 24px}
.footer-brand{display:flex;align-items:center;gap:14px}
.footer-brand img{width:48px;height:48px;border-radius:50%}
.footer-brand-text{display:flex;flex-direction:column;gap:2px}
.footer-brand-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px}
.footer-brand-sub{font-size:12px;color:var(--text-muted);letter-spacing:1px}
.footer-links{display:flex;gap:32px}
.footer-links a{font-family:'Barlow Condensed',sans-serif;font-weight:400;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);text-decoration:none}
.footer-links a:hover{color:var(--white)}
.footer-social{display:flex;gap:12px}
.footer-social a{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:var(--text-muted);text-decoration:none;font-size:16px;transition:all .3s}
.footer-social a:hover{background:rgba(192,57,43,0.15);border-color:rgba(192,57,43,0.3);color:var(--white)}
.footer-bottom{margin-top:50px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;max-width:1200px;margin:50px auto 0;padding:24px 24px 0}
.footer-copy{font-size:12px;color:rgba(255,255,255,0.3)}
.footer-aff{font-size:11px;color:rgba(255,255,255,0.25)}
.footer-back a{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);text-decoration:none}
.footer-back a:hover{color:var(--white)}

/* LOCK SCREEN */
.lock-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:72px 24px 40px;position:relative}
.lock-bg{position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(26,39,68,0.95) 0%,rgba(15,26,48,1) 70%);z-index:0}
.lock-bg::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:60px 60px}
.lock-card{position:relative;z-index:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:60px 48px;max-width:440px;width:100%;text-align:center;backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,0.3);animation:cardIn .6s ease forwards}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.lock-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--gold),var(--red));border-radius:20px 20px 0 0}
.lock-icon{width:72px;height:72px;margin:0 auto 28px;background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center}
.lock-icon svg{color:var(--red)}
.lock-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;margin-bottom:8px}
.lock-subtitle{font-weight:300;font-size:14px;color:var(--text-muted);margin-bottom:36px;line-height:1.6}
.lock-input{width:100%;padding:16px 20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--white);font-family:'Barlow',sans-serif;font-size:16px;letter-spacing:4px;text-align:center;outline:none;transition:all .3s}
.lock-input::placeholder{letter-spacing:1px;color:rgba(255,255,255,0.25);font-size:14px}
.lock-input:focus{border-color:rgba(192,57,43,0.5);background:rgba(255,255,255,0.06);box-shadow:0 0 20px rgba(192,57,43,0.1)}
.lock-btn{width:100%;padding:16px;background:var(--red);color:var(--white);border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;transition:all .35s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 20px rgba(192,57,43,0.3);margin-top:20px}
.lock-btn:hover{background:var(--red-glow);transform:translateY(-2px);box-shadow:0 8px 30px rgba(192,57,43,0.4)}
.lock-error{margin-top:16px;font-size:13px;color:var(--red-glow);opacity:0;transition:opacity .3s;height:20px}
.lock-error.show{opacity:1}
.lock-home{margin-top:32px}
.lock-home a{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.lock-home a:hover{color:var(--white)}

/* MEMBERS CONTENT */
.members-content{display:none;padding:120px 0 20px;flex:1}
.members-content.unlocked{display:block;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Page header */
.page-header{text-align:center;margin-bottom:32px}
.section-label{font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:12px}
.section-label::before{content:'';width:24px;height:1px;background:var(--red)}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,5vw,48px);letter-spacing:2px;line-height:1;margin-bottom:12px}
.page-desc{font-weight:300;font-size:15px;color:rgba(255,255,255,0.5);max-width:520px;margin:0 auto;line-height:1.7}

/* TABS */
.tab-bar{display:flex;gap:4px;background:rgba(255,255,255,0.03);border:1px solid var(--card-border);border-radius:12px;padding:4px;margin-bottom:32px}
.tab-btn{flex:1;padding:14px 16px;border:none;background:transparent;color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;border-radius:8px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.tab-btn:hover{color:var(--white);background:rgba(255,255,255,0.04)}
.tab-btn.active{background:var(--red);color:var(--white);box-shadow:0 4px 16px rgba(192,57,43,0.3)}
.tab-btn svg{width:16px;height:16px;flex-shrink:0}
.tab-panel{display:none;animation:fadeTab .4s ease}
.tab-panel.active{display:block}
@keyframes fadeTab{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ═══ DOCUMENTS TAB ═══ */
.doc-category{margin-bottom:36px}
.doc-category-header{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.doc-category-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.doc-category-icon.red{background:rgba(192,57,43,0.12);border:1px solid rgba(192,57,43,0.2);color:var(--red)}
.doc-category-icon.gold{background:rgba(212,169,82,0.12);border:1px solid rgba(212,169,82,0.2);color:var(--gold)}
.doc-category-icon.green{background:rgba(39,174,96,0.12);border:1px solid rgba(39,174,96,0.2);color:var(--green)}
.doc-category-icon.blue{background:rgba(52,152,219,0.12);border:1px solid rgba(52,152,219,0.2);color:var(--blue)}
.doc-category-icon.purple{background:rgba(142,68,173,0.12);border:1px solid rgba(142,68,173,0.2);color:#8e44ad}
.doc-category-icon.teal{background:rgba(22,160,133,0.12);border:1px solid rgba(22,160,133,0.2);color:#16a085}
.doc-category-icon.orange{background:rgba(230,126,34,0.12);border:1px solid rgba(230,126,34,0.2);color:#e67e22}
.doc-category-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px}
.doc-category-count{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-left:auto}
.required-note{display:inline-flex;align-items:center;gap:6px;margin-bottom:24px;font-size:13px;color:var(--gold);font-weight:400}
.required-note .star{color:var(--gold);font-weight:700}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.doc-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;text-decoration:none;color:var(--white);transition:all .3s;cursor:pointer}
.doc-card:hover{background:rgba(255,255,255,0.05);border-color:rgba(192,57,43,0.2);transform:translateY(-2px)}
.doc-card.required{border-left:3px solid var(--gold)}
.doc-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.25);color:#e74c3c}
.doc-icon.doc-blue{background:rgba(52,152,219,0.15);border:1px solid rgba(52,152,219,0.25);color:#3498db}
.doc-name{font-weight:500;font-size:14px;flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.doc-name .req-star{color:var(--gold);font-weight:700;font-size:14px;flex-shrink:0}
.doc-note{display:block;font-size:11px;font-weight:400;color:var(--text-muted);line-height:1.3;margin-top:2px}
.doc-dl{flex-shrink:0;color:var(--text-muted);opacity:.4;transition:opacity .3s}
.doc-card:hover .doc-dl{opacity:1}
.dl-svg{width:16px;height:16px}

/* ═══ ROSTER TAB ═══ */
.squad-card{margin-bottom:24px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;overflow:hidden}
.squad-header{display:flex;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.04);position:relative;overflow:hidden}
.squad-header::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.squad-header.c-red::before{background:var(--red)}
.squad-header.c-yellow::before{background:var(--yellow)}
.squad-header.c-blue::before{background:var(--blue)}
.squad-header.c-green::before{background:var(--green)}
.squad-color-badge{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;flex-shrink:0}
.squad-color-badge.c-red{background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.25);color:var(--red)}
.squad-color-badge.c-yellow{background:rgba(241,196,15,0.15);border:1px solid rgba(241,196,15,0.25);color:var(--yellow)}
.squad-color-badge.c-blue{background:rgba(52,152,219,0.15);border:1px solid rgba(52,152,219,0.25);color:var(--blue)}
.squad-color-badge.c-green{background:rgba(39,174,96,0.15);border:1px solid rgba(39,174,96,0.25);color:var(--green)}
.squad-info{flex:1}
.squad-name{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1.5px;line-height:1;margin-bottom:4px}
.squad-sgt{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;color:var(--text-muted)}
.squad-count{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);background:rgba(255,255,255,0.04);padding:4px 12px;border-radius:6px}
.squad-members{padding:8px 12px}
.member-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;transition:background .2s}
.member-row:hover{background:rgba(255,255,255,0.03)}
.member-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;flex-shrink:0;letter-spacing:.5px}
.member-avatar.c-red{background:rgba(192,57,43,0.15);color:var(--red)}
.member-avatar.c-yellow{background:rgba(241,196,15,0.15);color:var(--yellow)}
.member-avatar.c-blue{background:rgba(52,152,219,0.15);color:var(--blue)}
.member-avatar.c-green{background:rgba(39,174,96,0.15);color:var(--green)}
.member-name{font-weight:500;font-size:14px;flex:1}
.member-role{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:20px}
.role-lt{background:rgba(212,169,82,0.15);color:var(--gold)}
.role-sgt{background:rgba(212,169,82,0.12);color:var(--gold)}
.role-cadet{background:rgba(255,255,255,0.04);color:var(--text-muted)}
.role-prob{background:rgba(217,119,6,0.12);color:#d97706}
.role-suspended{background:rgba(220,38,38,0.12);color:var(--suspend-red)}
.role-loa{background:rgba(142,68,173,0.12);color:#8e44ad}
.member-note{font-size:11px;color:var(--text-muted);font-style:italic;margin-left:auto}

/* Admin card */
.admin-card{margin-bottom:24px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;overflow:hidden}
.admin-header{display:flex;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.04);position:relative}
.admin-header::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.admin-badge{width:42px;height:42px;border-radius:10px;background:rgba(212,169,82,0.15);border:1px solid rgba(212,169,82,0.25);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--gold)}

/* ═══ DIGITAL ID TAB ═══ */
.id-selector{text-align:center;margin-bottom:32px}
.id-selector p{font-size:14px;color:var(--text-muted);margin-bottom:16px;font-weight:300}
.id-name-input{width:100%;max-width:360px;padding:14px 18px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;color:var(--white);font-family:'Barlow',sans-serif;font-size:15px;outline:none;transition:all .3s;text-align:center;margin:0 auto;display:block}
.id-name-input:focus{border-color:rgba(192,57,43,0.4);box-shadow:0 0 16px rgba(192,57,43,0.08)}
.id-placeholder{text-align:center;padding:60px 20px;color:var(--text-muted)}
.id-placeholder svg{opacity:.2;margin-bottom:16px}
.id-placeholder p{font-size:14px;font-weight:300}

/* ID Card */
.id-card-wrap{max-width:400px;margin:0 auto;display:none}
.id-card-wrap.show{display:block}
.id-card{width:100%;border-radius:20px;overflow:hidden;background:linear-gradient(145deg,var(--navy) 0%,var(--navy-light) 50%,var(--navy) 100%);border:1px solid rgba(255,255,255,0.08);box-shadow:0 20px 60px rgba(0,0,0,0.4);position:relative}
.id-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;z-index:5}
.id-card.status-active::before{background:linear-gradient(90deg,var(--green),var(--gold),var(--green))}
.id-card.status-suspended::before{background:linear-gradient(90deg,var(--suspend-red),#ff4444,var(--suspend-red))}
.id-card.status-loa::before{background:linear-gradient(90deg,#8e44ad,var(--gold),#8e44ad)}
.id-card.status-prob::before{background:linear-gradient(90deg,#d97706,var(--gold),#d97706)}
.id-card::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.01) 1px,transparent 1px);background-size:20px 20px;pointer-events:none;z-index:1}

.id-card-header{background:rgba(0,0,0,0.2);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3;border-bottom:1px solid rgba(255,255,255,0.06)}
.id-card-header-left{display:flex;align-items:center;gap:10px}
.id-card-logo{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--red);border:1px solid rgba(255,255,255,0.1)}
.id-card-header-text{display:flex;flex-direction:column;gap:1px}
.id-card-dept{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.id-card-unit{font-family:'Barlow Condensed',sans-serif;font-weight:400;font-size:10px;letter-spacing:1px;color:var(--text-muted)}
.id-card-badge{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;padding:3px 10px;border-radius:6px}
.badge-active{color:var(--green);background:rgba(39,174,96,0.1);border:1px solid rgba(39,174,96,0.2)}
.badge-suspended{color:var(--suspend-red);background:rgba(220,38,38,0.1);border:1px solid rgba(220,38,38,0.2)}
.badge-loa{color:#8e44ad;background:rgba(142,68,173,0.1);border:1px solid rgba(142,68,173,0.2)}
.badge-prob{color:#d97706;background:rgba(217,119,6,0.1);border:1px solid rgba(217,119,6,0.2)}

.id-card-disclaimer{padding:10px 22px;background:rgba(192,57,43,0.1);border-bottom:1px solid rgba(192,57,43,0.15);position:relative;z-index:3;text-align:center;display:flex;flex-direction:column;gap:1px}
.id-card-disclaimer .line1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--red)}
.id-card-disclaimer .line2{font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(192,57,43,0.7)}

.id-card-body{padding:22px 22px 18px;display:flex;gap:18px;align-items:flex-start;position:relative;z-index:3}
.id-card-photo{width:80px;height:100px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.id-card-info{flex:1;display:flex;flex-direction:column;gap:10px}
.id-card-rank{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.id-card-name{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;line-height:1}
.id-card-details{display:flex;flex-direction:column;gap:5px}
.id-card-detail{display:flex;align-items:center;gap:8px;font-size:11px}
.id-card-detail-label{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);width:50px;flex-shrink:0}

.status-suspended .id-card-status{background:rgba(220,38,38,0.06);border-top:1px solid rgba(220,38,38,0.15)}

.status-suspended .id-status-badge{color:var(--suspend-red)}
.status-loa .id-status-badge{color:#8e44ad}
.status-prob .id-status-badge{color:#d97706}

.status-suspended .status-dot{background:var(--suspend-red);animation:pulseR 1.2s ease infinite}
.status-loa .status-dot{background:#8e44ad;animation:pulseP 2s ease infinite}
.status-prob .status-dot{background:#d97706;animation:pulseO 2s ease infinite}

@keyframes pulseR{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(220,38,38,0.4)}50%{opacity:.5;box-shadow:0 0 0 6px rgba(220,38,38,0)}}
@keyframes pulseP{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes pulseO{0%,100%{opacity:1}50%{opacity:.5}}

.id-card-live{padding:10px 22px;background:rgba(0,0,0,0.12);display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3;border-top:1px solid rgba(255,255,255,0.03)}

.status-active .id-live-text{color:var(--green);animation:flashG 1.5s ease infinite}
.status-suspended .id-live-text{color:var(--suspend-red);animation:flashR 1s ease infinite}
.status-loa .id-live-text{color:#8e44ad;animation:flashP 1.5s ease infinite}
.status-prob .id-live-text{color:#d97706;animation:flashO 1.5s ease infinite}
.id-live-dot{width:6px;height:6px;border-radius:50%}
.status-active .id-live-dot{background:var(--green);animation:flashG 1.5s ease infinite}
.status-suspended .id-live-dot{background:var(--suspend-red);animation:flashR 1s ease infinite}
.status-loa .id-live-dot{background:#8e44ad;animation:flashP 1.5s ease infinite}
.status-prob .id-live-dot{background:#d97706;animation:flashO 1.5s ease infinite}
@keyframes flashG{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes flashR{0%,100%{opacity:1}50%{opacity:.1}}
@keyframes flashP{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes flashO{0%,100%{opacity:1}50%{opacity:.15}}
.id-live-time{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,0.25)}

.id-card-verify span{font-family:'Barlow Condensed',sans-serif;font-size:7.5px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.2)}

<script>
/* ── Shared roster renderer (members page) ──
   After the page decrypts, connect to the shared roster and render the
   leadership block, squads, and alumni into #sharedRosterMount, live. */
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const SQUAD_AVATAR = { leadership:'c-red', 1:'c-red', 2:'c-yellow', 3:'c-blue', 4:'c-green' };

  function memberRowHTML(m, squad, isLead){
    const R = window.RPDRoster;
    let avatarCls = SQUAD_AVATAR[squad] || 'c-red';
    let avatarStyle = '';
    if(isLead) avatarStyle = ' style="background:rgba(212,169,82,0.15);color:#d4a952"';

    let roleLabel, roleCls;
    if(m.status === 'loa'){ roleLabel = 'LOA'; roleCls = 'role-loa'; }
    else if(m.status === 'suspended'){ roleLabel = 'Suspended'; roleCls = 'role-suspended'; avatarStyle = ' style="background:rgba(220,38,38,0.15);color:#dc2626"'; }
    else {
      roleLabel = m.title || R.defaultRoleLabel(m.rank);
      roleCls = (m.rank==='Captain'||m.rank==='Lt.') ? 'role-lt' : (m.rank==='Sgt.') ? 'role-sgt' : (m.rank==='Probationary') ? 'role-prob' : 'role-cadet';
    }
    const note = m.note ? `<span class="member-note">${esc(m.note)}</span>` : '';
    const avatar = m.open ? 'CP' : R.initials(m.name);
    const nameHTML = m.open
      ? `Captain <em style="color:var(--text-muted)">(Position Open)</em>`
      : esc(R.displayName(m));
    return `<div class="member-row"><div class="member-avatar ${avatarCls}"${avatarStyle}>${esc(avatar)}</div>`
      + `<span class="member-name">${nameHTML}</span>`
      + `<span class="member-role ${roleCls}">${esc(roleLabel)}</span>${note}</div>`;
  }

  window.renderSharedRoster = function(){
    const mount = document.getElementById('sharedRosterMount');
    if(!mount || typeof window.RPDRoster === 'undefined') return;
    const R = window.RPDRoster;
    let html = '';

    R.bySquad().forEach(g => {
      if(g.squad === 'leadership'){
        html += `<div class="admin-card"><div class="admin-header"><div class="admin-badge">ADM</div>`
          + `<div class="squad-info"><div class="squad-name">Unit Leadership</div><div class="squad-sgt">Richardson Police Public Safety Cadets</div></div></div>`
          + `<div class="squad-members">`;
        g.members.forEach(m => html += memberRowHTML(m, 'leadership', true));
        html += `</div></div>`;
      } else {
        const lead = g.members.find(m => m.rank === 'Sgt.');
        const nonLead = g.members.filter(m => m !== lead);
        const allCadets = nonLead.length && nonLead.every(m => m.rank === 'Cadet' && (!m.status || m.status === 'active'));
        const countPill = nonLead.length ? `<div class="squad-count">${nonLead.length} ${allCadets ? 'Cadets' : 'Members'}</div>` : '';
        const leadLine = lead ? 'Led by ' + esc(R.displayName(lead)) : '';
        html += `<div class="squad-card"><div class="squad-header ${g.meta.color === 'red' ? 'c-red' : g.meta.color === 'yellow' ? 'c-yellow' : g.meta.color === 'blue' ? 'c-blue' : 'c-green'}">`
          + `<div class="squad-color-badge ${g.meta.color === 'red' ? 'c-red' : g.meta.color === 'yellow' ? 'c-yellow' : g.meta.color === 'blue' ? 'c-blue' : 'c-green'}">${esc(g.meta.badge)}</div>`
          + `<div class="squad-info"><div class="squad-name">${esc(g.meta.label)}</div><div class="squad-sgt">${leadLine}</div></div>${countPill}</div>`
          + `<div class="squad-members">`;
        g.members.forEach(m => html += memberRowHTML(m, g.squad, false));
        html += `</div></div>`;
      }
    });

    const alumni = R.getAlumni();
    if(alumni.length){
      html += `<div class="admin-card" style="margin-top:32px;opacity:0.6"><div class="admin-header" style="border-bottom:none">`
        + `<div class="admin-badge" style="background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.08);color:var(--text-muted)">ALM</div>`
        + `<div class="squad-info"><div class="squad-name" style="color:var(--text-muted)">Alumni</div><div class="squad-sgt">Former members who left in good standing</div></div></div>`
        + `<div class="squad-members">`;
      alumni.forEach(a => {
        const nm = (a.title ? esc(a.title) + ' ' : '') + esc(a.name);
        const note = a.note ? `<span class="member-note">${esc(a.note)}</span>` : '';
        html += `<div class="member-row"><div class="member-avatar" style="background:rgba(255,255,255,0.04);color:var(--text-muted)">${esc(R.initials(a.name))}</div>`
          + `<span class="member-name" style="color:var(--text-muted)">${nm}</span>${note}</div>`;
      });
      html += `</div></div>`;
    }

    mount.innerHTML = html;
  };

  let _subscribed = false;
  window.connectAndRender = async function(password){
    try {
      if(typeof window.RPDRoster === 'undefined') return;
      const res = await window.RPDRoster.connect({ passcode: password, role: 'cadet' });
      if(res && res.ok){
        window.renderSharedRoster();
        if(!_subscribed){ window.RPDRoster.subscribe(() => window.renderSharedRoster()); _subscribed = true; }
      } else {
        const mount = document.getElementById('sharedRosterMount');
        if(mount) mount.innerHTML = '<p style="color:var(--text-muted);padding:24px;text-align:center">Roster is being set up. Check the Admin page.</p>';
      }
    } catch(e){ /* offline: leave the panel empty rather than erroring */ }
  };
})();
</script>

  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  function b64ToArr(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function decryptContent(password) {

      const header = b64ToArr(headerB64);
      const salt = header.slice(0, 16);
      const iv = header.slice(16, 28);
      const tag = header.slice(28, 44);
      const ciphertext = b64ToArr(cipherB64);
      // Combine ciphertext + tag for Web Crypto (it expects them concatenated)
      const combined = new Uint8Array(ciphertext.length + tag.length);
      combined.set(ciphertext);
      combined.set(tag, ciphertext.length);
      const key = await deriveKey(password, salt);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, combined);
      return new TextDecoder().decode(decrypted);
    } catch(e) {
      return null;
    }
  }

          document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
          var m={docs:0,roster:1,forms:2};
          var p={docs:'panelDocs',roster:'panelRoster',forms:'panelForms'};
          document.querySelectorAll('.tab-btn')[m[t]].classList.add('active');
          document.getElementById(p[t]).classList.add('active');
        };
      }
    } else {
      error.classList.add('show');
      input.value = '';
      input.focus();
      const c = document.querySelector('.lock-card');
      c.style.animation = 'none';
      c.offsetHeight;
      c.style.animation = 'shake .5s ease';
    }
  }

  // Auto-unlock from session
  async function trySession() {
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (!saved) return;
    const html = await decryptContent(saved);
    if (html) {
      document.getElementById('lockScreen').style.display = 'none';
      const container = document.getElementById(CONTENT_ID);
      container.innerHTML = html;
      container.classList.add('unlocked');
      if (window.connectAndRender) window.connectAndRender(saved);
      
      // Re-init tabs after decryption
      if (typeof switchTab === 'undefined') {
        window.switchTab = function(t){
          document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
          var m={docs:0,roster:1,forms:2};
          var p={docs:'panelDocs',roster:'panelRoster',forms:'panelForms'};
          document.querySelectorAll('.tab-btn')[m[t]].classList.add('active');
          document.getElementById(p[t]).classList.add('active');
        };
      }
    }
  }

  document.getElementById('unlockBtn').addEventListener('click', unlockPage);
  document.getElementById('passcodeInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') unlockPage();
    document.getElementById('lockError').classList.remove('show');
  });

  const shakeStyle = document.createElement('style');
  shakeStyle.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}';
  document.head.appendChild(shakeStyle);

  trySession();
})();
</script>
<script>
function switchTab(t){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  var m={docs:0,roster:1,forms:2};
  var p={docs:'panelDocs',roster:'panelRoster',forms:'panelForms'};
  document.querySelectorAll('.tab-btn')[m[t]].classList.add('active');
  document.getElementById(p[t]).classList.add('active');
}
</script>
<script src="shared.js"></script>
</body>
